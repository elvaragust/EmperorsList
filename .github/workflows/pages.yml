# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the built-in Wahapedia stratagems stay current.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The relay test starts the real server, which needs its one dependency.
      - run: npm ci --prefix server
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables):
          # RELAY_URL = wss://<new address>/relay to run live games through the self-hosted server,
          # NEW_HOME  = https://<new address> to show the "new home / Move my data" banner here.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
          VITE_NEW_HOME: ${{ vars.NEW_HOME }}
      # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      # Wahapedia extras (stratagems etc.), published next to the app. Never fails the build.
      - run: node scripts/wahapedia.mjs dist/wahapedia || true
      # Core Rules text for in-app rule popups. Never fails the build.
      - run: node scripts/core-rules.mjs dist/wahapedia || true
      # Mission deck card text (primaries, secondaries, twists, deployments). Never fails the build.
      - run: node scripts/missions.mjs dist/wahapedia || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
